name: 采集品类热度

on:
  schedule:
    # 每天 UTC 01:17 = 北京时间 09:17
    # 故意避开整点，整点是 GitHub Actions 的高峰，容易排队延迟
    - cron: "17 1 * * *"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 需要写权限才能把结果 commit 回仓库

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集
        env:
          # GitHub Actions 自带这个 token，自动获得认证后的限额
          # （搜索接口 30 次/分，未认证只有 10 次/分）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collect.py

      - name: 提交结果
        run: |
          git config user.name "tool-radar"
          git config user.email "actions@github.com"
          git add data reports
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "采集 $(date -u +%F)"
            git push
          fi
